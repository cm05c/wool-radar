<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>羊毛雷达 · 全网薅羊毛监控</title>
<meta name="description" content="羊毛雷达 LiveWool —— 分渠道收纳全网薅羊毛资源，实时展示羊毛渠道、数据链接与羊毛物品。" />
<meta name="theme-color" content="#ff5c3a" />
<style>
/* ========== 设计变量 ========== */
:root {
  --primary: #ef5a34;
  --primary-dark: #d2471f;
  --primary-soft: #fdf1ec;
  --bg: #f7f7f9;
  --card: #ffffff;
  --text: #23262b;
  --text-2: #5c6270;
  --text-3: #9aa0ab;
  --line: #ececf0;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(31, 35, 41, .04), 0 4px 14px rgba(31, 35, 41, .04);
  --max-w: 1180px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  letter-spacing: .1px;
}
::selection { background: rgba(239, 90, 52, .16); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #dcdce2; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: #c9c9d1; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

/* ========== 顶栏 ========== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: var(--max-w); margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.logo {
  display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px;
  letter-spacing: -.2px;
}
.logo:hover { opacity: .88; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  background: var(--primary);
  display: grid; place-items: center; color: #fff; font-size: 16px;
}
.logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
.live-dot::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: #22c55e; animation: pulse 1.6s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.refresh-btn {
  border: 1px solid var(--line); background: #fff; color: var(--text-2);
  padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: all .2s;
}
.refresh-btn:hover { border-color: var(--primary); color: var(--primary); }
.refresh-btn:active { transform: scale(.96); }
.refresh-btn.loading { opacity: .5; pointer-events: none; }

/* ========== 头部区 ========== */
.hero {
  max-width: var(--max-w); margin: 0 auto; padding: 44px 20px 12px;
}
.hero h1 { font-size: clamp(25px, 4vw, 34px); font-weight: 700; letter-spacing: -.8px; line-height: 1.3; color: #1a1d22; }
.hero h1 em { font-style: normal; color: var(--primary); }
.hero p { color: var(--text-2); margin-top: 8px; font-size: 14.5px; }
.hero .tagline-dot { color: var(--text-3); margin: 0 6px; }
.stats { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; position: relative; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; min-width: 132px; flex: 1;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 12px;
  transition: transform .18s, box-shadow .18s;
}
.stat:hover { transform: translateY(-1px); }
.stat .icon {
  width: 42px; height: 42px; flex: none; border-radius: 11px; font-size: 20px;
  display: grid; place-items: center; background: #f4f4f6;
}
.stat b { display: block; font-size: 21px; color: #1a1d22; font-variant-numeric: tabular-nums; line-height: 1.25; font-weight: 650; }
.stat span { font-size: 12px; color: var(--text-3); }

/* ========== 渠道汇总弹层（收纳于覆盖渠道卡内） ========== */
.stat-channels { position: relative; cursor: pointer; }
.stat-channels:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(31,35,41,.09); }
.stat-channels .icon { transition: transform .18s; }
.stat-channels.open .icon { transform: rotate(90deg); }
/* 弹层展开时整卡置于全页最上层，弹层悬浮于遮罩之上 */
.stat-channels.open { z-index: 90; }
.pop-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(31,35,41,.06);
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.stat-channels.filtered { border-color: var(--primary); box-shadow: 0 1px 2px rgba(239,90,52,.12), 0 4px 14px rgba(239,90,52,.14); }
.stat-channels.filtered b { color: var(--primary-dark); }
.channels-pop {
  position: absolute; top: calc(100% + 10px); left: 0; z-index: 91;
  width: min(400px, 100%); max-height: min(400px, 60vh); overflow-y: auto;
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(31,35,41,.05), 0 12px 36px rgba(31,35,41,.13);
  padding: 14px; text-align: left;
  animation: popIn .18s cubic-bezier(.22,.7,.4,1);
}
@keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
.channels-pop .pop-title { font-size: 12.5px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; }
/* 渠道列表：上下分列，每行一个渠道，独占一行不挤占他框 */
.channels { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.ch-pill {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px; cursor: pointer; text-align: left;
  transform-origin: left center; position: relative;
  transition: transform .18s cubic-bezier(.22,.7,.4,1), box-shadow .18s, border-color .18s, background .18s;
}
.ch-name { flex: 1; }
/* 悬停放大 + 拾起阴影；点击按压缩小 */
.ch-pill:hover {
  border-color: #c9cacd; background: #fafafa;
  transform: scale(1.03); box-shadow: 0 5px 16px rgba(31,35,41,.12); z-index: 1;
}
.ch-pill:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(31,35,41,.10); transition-duration: .08s; }
.ch-pill.active { background: #23262b; border-color: #23262b; }
.ch-pill.active .ch-name, .ch-pill.active .ch-meta { color: #fff; }
.ch-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
.ch-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ch-pill.active .ch-meta { opacity: .75; }
.ch-guide-flag { font-size: 11px; color: var(--primary-dark); background: var(--primary-soft); padding: 1px 7px; border-radius: 999px; }
.ch-pill.active .ch-guide-flag { background: rgba(255,255,255,.18); color: #fff; }

/* ========== 筛选区 ========== */
.toolbar {
  max-width: var(--max-w); margin: 22px auto 0; padding: 0 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.search-row { display: flex; gap: 10px; flex-wrap: wrap; }
.search-box {
  flex: 1; min-width: 220px; position: relative;
}
.search-box svg {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-3);
}
.search-box input {
  width: 100%; padding: 11px 14px 11px 38px;
  border: 1px solid var(--line); border-radius: 11px; font-size: 13.5px;
  background: #fff; outline: none; transition: border-color .2s, box-shadow .2s;
  color: var(--text);
}
.search-box input::placeholder { color: var(--text-3); }
.search-box input:focus {
  border-color: #c9cacd;
  box-shadow: 0 0 0 3px rgba(35, 38, 43, .06);
}
select.sort-select {
  padding: 11px 14px; border: 1px solid var(--line); border-radius: 11px;
  font-size: 13.5px; background: #fff; color: var(--text-2); cursor: pointer; outline: none;
  transition: border-color .2s;
}
select.sort-select:hover { border-color: #c9cacd; }
.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 15px; border-radius: 8px; font-size: 13px;
  background: #fff; border: 1px solid var(--line); color: var(--text-2);
  cursor: pointer; transition: all .18s; user-select: none;
}
.chip:hover { border-color: #c9cacd; color: var(--text); background: #fafafa; }
.chip.active {
  background: #23262b; border-color: #23262b; color: #fff;
}
.chip .count { opacity: .6; font-size: 12px; margin-left: 3px; }

/* ========== 卡片流 ========== */
.grid-wrap { max-width: var(--max-w); margin: 14px auto 48px; padding: 0 20px; }
.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 20px 17px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  position: relative; overflow: hidden;
  animation: cardIn .45s cubic-bezier(.22,.7,.4,1) both;
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 2.5px;
  background: var(--cat-color, var(--line));
  transition: width .18s;
}
.card:hover { transform: translateY(-3px); border-color: #e0e0e6; box-shadow: 0 1px 2px rgba(31,35,41,.04), 0 10px 26px rgba(31,35,41,.08); }
.card:hover::before { width: 4px; }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card.expired { opacity: .55; filter: grayscale(.6); }
.card-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.badge {
  font-size: 11.5px; padding: 2.5px 9px; border-radius: 6px;
  background: #f4f4f6; color: var(--text-2); font-weight: 550;
}
.badge.cat { background: var(--primary-soft); color: var(--primary-dark); }
.badge.verified { background: #eef8f2; color: #2a9d6f; font-weight: 550; }
.expiry { font-size: 12px; color: var(--text-3); margin-left: auto; }
.expiry.urgent { color: var(--primary-dark); font-weight: 600; }
.card h3 { font-size: 15.5px; font-weight: 650; line-height: 1.5; color: #1a1d22; }
.card .desc { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.65; }
.value-tag {
  align-self: flex-start; font-size: 12.5px; font-weight: 600;
  color: var(--primary-dark); background: var(--primary-soft);
  padding: 2.5px 10px; border-radius: 6px;
}
.card-bottom { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 6px; }

/* ========== 薅羊毛攻略 ========== */
.guide {
  border: 1px solid var(--line); border-radius: 10px;
  background: #fafafa; font-size: 12.5px; overflow: hidden;
}
.guide summary {
  cursor: pointer; padding: 9px 12px; font-weight: 600;
  color: var(--text-2); user-select: none; list-style-position: inside;
  transition: background .15s;
}
.guide summary:hover { background: #f1f1f4; }
.guide ol { margin: 2px 12px 10px 30px; color: var(--text-2); display: grid; gap: 5px; }
.guide ol li::marker { color: var(--primary); font-weight: 700; }
.guide[open] summary { border-bottom: 1px dashed var(--line); color: var(--primary-dark); }
.hot { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 4px; }
.go-btn {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary); color: #fff; font-size: 12.5px; font-weight: 600;
  padding: 8px 15px; border-radius: 8px;
  box-shadow: 0 1px 3px rgba(210, 71, 31, .24);
  transition: background .18s, transform .18s, box-shadow .18s;
}
.go-btn:hover { background: var(--primary-dark); box-shadow: 0 3px 10px rgba(210, 71, 31, .3); transform: translateY(-1px); }
.go-btn:active { transform: scale(.96); }

/* ========== 状态展示 ========== */
.status { text-align: center; padding: 70px 20px; color: var(--text-3); font-size: 14px; }
.status .big { font-size: 40px; margin-bottom: 8px; }
.skeleton {
  height: 150px; border-radius: var(--radius);
  background: linear-gradient(100deg, #ececf0 40%, #f6f6f8 50%, #ececf0 60%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ========== 页脚 ========== */
footer {
  border-top: 1px solid var(--line); background: #fff;
  padding: 26px 20px; text-align: center; color: var(--text-3); font-size: 12.5px;
}
footer b { color: var(--text-2); }
#updatedAt { color: var(--primary-dark); }

/* ========== 移动端 ========== */
@media (max-width: 640px) {
  .hero { padding-top: 24px; }
  .stat { min-width: 90px; padding: 10px 14px; }
  .stat b { font-size: 18px; }
  .grid { grid-template-columns: 1fr; }
  .topbar-inner { padding: 10px 16px; }
  .toolbar { padding: 0 16px; }
  .grid-wrap { padding: 0 16px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">🐑</span>
      <span>羊毛雷达<small style="font-weight:500;color:var(--text-3);font-size:12px;margin-left:6px">LiveWool</small></span>

<script>
(function () {
  "use strict";

  /* ====== 分类色板 & 渠道图标 ====== */
  var CATEGORY_COLORS = {
    "外卖": "#e2795b", "电商": "#6b93d8", "话费": "#4cae87", "会员": "#9a8be0",
    "金融": "#cfa356", "出行": "#5db4cd", "教育": "#cf85b3", "办公": "#8a92a0",
    "白嫖": "#66bd8b", "资讯": "#ab9a6c", "其他": "#a3a9b2"
  };
  var CHANNEL_EMOJI = {
    "淘宝": "🛒", "京东": "📦", "拼多多": "🧧", "美团": "🍔", "饿了么": "🛵",
    "支付宝": "💰", "云闪付": "💳", "哔哩哔哩": "📺", "爱奇艺": "🎬",
    "网易云音乐": "🎵", "中国银行": "🏦", "建设银行": "🏛", "滴滴出行": "🚗",
    "顺丰": "📮", "Apple": "🍎", "中国联通": "📶", "WPS": "📝", "网易": "📚",
    "少数派": "✍️", "小众软件": "🧰", "异次元": "🚀", "IT之家": "📰",
    "蓝点网": "🔵", "什么值得买": "🛍", "V2EX": "💬",
    "麦当劳": "🍟", "瑞幸咖啡": "☕", "霸王茶姬": "🍵", "塔斯汀": "🥯"
  };
  function catColor(cat) { return CATEGORY_COLORS[cat || "其他"] || CATEGORY_COLORS["其他"]; }
  function chEmoji(ch) { return CHANNEL_EMOJI[ch] || "📡"; }

  /* ====== 全局状态 ====== */
  var DATA_URL = "data/deals.json";
  var state = {
    items: [],
    activeCategory: "all",
    activeChannel: null,
    keyword: "",
    sortBy: "waimai"
  };
  var AUTO_REFRESH_MS = 5 * 60 * 1000; // 每 5 分钟自动拉取最新数据

  var grid = document.getElementById("grid");
  var status = document.getElementById("status");
  var chipsBox = document.getElementById("chips");
  var channelsBox = document.getElementById("channels");
  var channelsPop = document.getElementById("channelsPop");
  var popOverlay = document.getElementById("popOverlay");
  var statChannelsCard = document.getElementById("statChannelsCard");
  var searchInput = document.getElementById("searchInput");
  var sortSelect = document.getElementById("sortSelect");
  var refreshBtn = document.getElementById("refreshBtn");
  var liveDot = document.getElementById("liveDot");

  /* ====== 工具函数 ====== */
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeAgo(iso) {
    if (!iso) return "";
    var diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff)) return "";
    var m = Math.floor(diff / 60000);
    if (m < 1) return "刚刚";
    if (m < 60) return m + " 分钟前";
    var h = Math.floor(m / 60);
    if (h < 24) return h + " 小时前";
    return Math.floor(h / 24) + " 天前";
  }
  function expiryInfo(iso) {
    if (!iso) return { text: "长期有效", urgent: false, days: 9999 };
    var end = new Date(iso).getTime();
    if (isNaN(end)) return { text: "长期有效", urgent: false, days: 9999 };
    var days = Math.ceil((end - Date.now()) / 86400000);
    if (days < 0) return { text: "已过期", urgent: false, days: days };
    if (days === 0) return { text: "今天到期 ⏰", urgent: true, days: 0 };
    return { text: "剩 " + days + " 天", urgent: days <= 2, days: days };
  }
  function relUrl(url) {
    return url + (url.indexOf("?") > -1 ? "&" : "?") + "_t=" + Date.now();
  }

  /* ====== 数据加载（cache-bust，保证拿到最新） ====== */
  function load(showSkeleton) {
    if (showSkeleton) renderSkeleton();
    refreshBtn.classList.add("loading");

    fetch(relUrl(DATA_URL), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        state.items = (data.items || []).map(function (it, i) {
          it._uid = it.id || "item-" + i;
          return it;
        });
        liveDot.hidden = false;
        document.getElementById("updatedAt").textContent =
          data.updatedAt ? timeAgo(data.updatedAt) + "（" + data.updatedAt.replace("T", " ").slice(0, 16) + "）" : "未知";
        renderChips();
        renderChannels();
        render();
        refreshBtn.classList.remove("loading");
      })
      .catch(function (err) {
        console.error("加载失败:", err);
        refreshBtn.classList.remove("loading");
        if (!state.items.length) {
          grid.innerHTML = "";
          status.hidden = false;
          status.innerHTML = '<div class="big">📡</div>数据加载失败，请稍后点击「刷新」重试';
        }
      });
  }

  function renderSkeleton() {
    grid.innerHTML = "";
    for (var i = 0; i < 6; i++) {
      var d = document.createElement("div");
      d.className = "skeleton";
      grid.appendChild(d);
    }
    status.hidden = true;
  }

  /* ====== 分类 chips ====== */
  function renderChips() {
    var cats = {};
    state.items.forEach(function (it) {
      var c = it.category || "其他";
      cats[c] = (cats[c] || 0) + 1;
    });
    var html = '<button class="chip' + (state.activeCategory === "all" ? " active" : "") + '" data-cat="all" role="tab">全部<span class="count">' + state.items.length + "</span></button>";
    Object.keys(cats).forEach(function (c) {
      html += '<button class="chip' + (state.activeCategory === c ? " active" : "") + '" data-cat="' + escapeHtml(c) + '" role="tab">' + escapeHtml(c) + '<span class="count">' + cats[c] + "</span></button>";
    });
    chipsBox.innerHTML = html;
  }

  /* ====== 渠道汇总（收纳于覆盖渠道统计卡） ====== */
  function renderChannels() {
    var agg = {};
    state.items.forEach(function (it) {
      var c = it.channel || "未知渠道";
      if (!agg[c]) agg[c] = { count: 0, guides: 0, hot: 0 };
      agg[c].count++;
      if (it.guide) agg[c].guides++;
      agg[c].hot += it.hot || 0;
    });
    var list = Object.keys(agg).sort(function (a, b) {
      if (a === state.activeChannel) return -1;
      if (b === state.activeChannel) return 1;
      return agg[b].count - agg[a].count || agg[b].hot - agg[a].hot;
    });
    var html = "";
    list.forEach(function (c) {
      var a = agg[c];
      var active = state.activeChannel === c;
      html += '<button class="ch-pill' + (active ? " active" : "") + '" data-ch="' + escapeHtml(c) + '" type="button">' +
        '<span class="ch-name">' + chEmoji(c) + " " + escapeHtml(c) + "</span>" +
        '<span class="ch-meta">' + a.count + " 条</span>" +
        (a.guides ? '<span class="ch-guide-flag">📋×' + a.guides + "</span>" : "") +
        "</button>";
    });
    channelsBox.innerHTML = html;
    // 渠道筛选激活时高亮统计卡
    statChannelsCard.classList.toggle("filtered", !!state.activeChannel);
  }

  function closeChannelsPop() {
    channelsPop.hidden = true;
    popOverlay.hidden = true;
    statChannelsCard.classList.remove("open");
    statChannelsCard.setAttribute("aria-expanded", "false");
  }
  function toggleChannelsPop() {
    var willOpen = channelsPop.hidden;
    closeChannelsPop();
    if (willOpen) {
      channelsPop.hidden = false;
      popOverlay.hidden = false;
      statChannelsCard.classList.add("open");
      statChannelsCard.setAttribute("aria-expanded", "true");
    }
  }

  statChannelsCard.addEventListener("click", function (e) {
    // 弹层内部的点击不重复触发开关
    if (e.target.closest(".channels-pop")) return;
    toggleChannelsPop();
  });
  statChannelsCard.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleChannelsPop(); }
  });
  // 点击页面任意区域（遮罩）收回弹层
  popOverlay.addEventListener("click", closeChannelsPop);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !channelsPop.hidden) closeChannelsPop();
  });
  document.addEventListener("click", function (e) {
    if (!channelsPop.hidden && !e.target.closest(".stat-channels")) closeChannelsPop();
  });

  channelsBox.addEventListener("click", function (e) {
    var pill = e.target.closest(".ch-pill");
    if (!pill) return;
    var name = pill.getAttribute("data-ch");
    state.activeChannel = state.activeChannel === name ? null : name;
    renderChannels();
    render();
    // 选择渠道后收起弹层，让用户直接看到筛选结果
    closeChannelsPop();
  });

  /* ====== 过滤 + 排序 + 渲染 ====== */
  function getFiltered() {
    var kw = state.keyword.trim().toLowerCase();
    var list = state.items.filter(function (it) {
      if (state.activeCategory !== "all" && (it.category || "其他") !== state.activeCategory) return false;
      if (state.activeChannel && (it.channel || "未知渠道") !== state.activeChannel) return false;
      if (!kw) return true;
      var hay = [it.title, it.desc, it.channel, it.category, (it.tags || []).join(" ")].join(" ").toLowerCase();
      return hay.indexOf(kw) > -1;
    });
    list.forEach(function (it) { it._exp = expiryInfo(it.expiresAt); });
    list.sort(function (a, b) {
      if (state.sortBy === "waimai") {
        // 外卖分类置顶；同为外卖（或同非外卖）时按发布时间倒序
        var ra = a.category === "外卖" ? 0 : 1;
        var rb = b.category === "外卖" ? 0 : 1;
        if (ra !== rb) return ra - rb;
        return new Date(b.publishedAt || b.updatedAt || 0) - new Date(a.publishedAt || a.updatedAt || 0);
      }
      if (state.sortBy === "hot") return (b.hot || 0) - (a.hot || 0);
      if (state.sortBy === "expire") {
        if (a._exp.days < 0 && b._exp.days < 0) return 0;
        if (a._exp.days < 0) return 1;
        if (b._exp.days < 0) return -1;
        return a._exp.days - b._exp.days;
      }
      return new Date(b.publishedAt || b.updatedAt || 0) - new Date(a.publishedAt || a.updatedAt || 0);
    });
    // 过期项沉底
    var alive = list.filter(function (x) { return x._exp.days >= 0; });
    var dead = list.filter(function (x) { return x._exp.days < 0; });
    return alive.concat(dead);
  }

  function render() {
    var list = getFiltered();
    updateStats();

    if (!list.length) {
      grid.innerHTML = "";
      status.hidden = false;
      var ctx = [];
      if (state.activeChannel) ctx.push("渠道「" + state.activeChannel + "」");
      if (state.activeCategory !== "all") ctx.push("分类「" + state.activeCategory + "」");
      if (state.keyword) ctx.push("关键词「" + state.keyword + "」");
      status.innerHTML = '<div class="big">🔍</div>' + (ctx.length ? "当前筛选：" + ctx.join(" + ") + " 下没有羊毛" : "没有找到符合条件的羊毛") + "，换个条件试试";
      return;
    }
    status.hidden = true;

    var html = "";
    list.forEach(function (it, idx) {
      var exp = it._exp;
      var cat = it.category || "其他";
      html +=
        '<article class="card' + (exp.days < 0 ? " expired" : "") + '" style="--cat-color:' + catColor(cat) + ";animation-delay:" + Math.min(idx * 35, 420) + 'ms">' +
          '<div class="card-top">' +
            '<span class="badge" title="来源渠道">' + chEmoji(it.channel) + " " + escapeHtml(it.channel || "未知渠道") + "</span>" +
            '<span class="badge cat" style="background:' + catColor(cat) + "1a;color:" + catColor(cat) + '">' + escapeHtml(cat) + "</span>" +
            '<span class="expiry' + (exp.urgent ? " urgent" : "") + '">' + escapeHtml(exp.text) + "</span>" +
            (it.verified ? '<span class="badge verified" title="链接已验证真实可达">✓ 已验链</span>' : "") +
          "</div>" +
          "<h3>" + escapeHtml(it.title) + "</h3>" +
          (it.desc ? '<p class="desc">' + escapeHtml(it.desc) + "</p>" : "") +
          (it.value ? '<span class="value-tag">🎁 ' + escapeHtml(it.value) + "</span>" : "") +
          (it.guide
            ? '<details class="guide"><summary>📋 ' + escapeHtml(it.guide.title) + "</summary><ol>" +
              it.guide.steps.map(function (s) { return "<li>" + escapeHtml(s) + "</li>"; }).join("") +
              "</ol></details>"
            : "") +
          '<div class="card-bottom">' +
            '<span class="hot">🔥 ' + (it.hot || 0) + " 热度 · " + escapeHtml(timeAgo(it.publishedAt || it.updatedAt)) + "</span>" +
            '<a class="go-btn" href="' + escapeHtml(it.url || "#") + '" target="_blank" rel="noopener noreferrer nofollow">去薅羊毛 →</a>' +
          "</div>" +
        "</article>";
    });
    grid.innerHTML = html;
  }

  function updateStats() {
    var today = new Date().toISOString().slice(0, 10);
    var expiring = 0;
    state.items.forEach(function (it) {
      var e = expiryInfo(it.expiresAt);
      if (e.days >= 0 && e.days <= 2) expiring++;
    });
    var channels = {};
    state.items.forEach(function (it) { channels[it.channel || "未知"] = 1; });
    var todayCount = state.items.filter(function (it) {
      return (it.publishedAt || it.updatedAt || "").slice(0, 10) === today;
    }).length;

    document.getElementById("statTotal").textContent = state.items.length;
    document.getElementById("statChannels").textContent = Object.keys(channels).length;
    document.getElementById("statToday").textContent = todayCount;
    document.getElementById("statExpiring").textContent = expiring;
  }

  /* ====== 事件绑定 ====== */
  chipsBox.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    state.activeCategory = btn.getAttribute("data-cat");
    chipsBox.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
    btn.classList.add("active");
    render();
  });

  var debounceTimer = null;
  searchInput.addEventListener("input", function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      state.keyword = searchInput.value;
      render();
    }, 200);
  });

  sortSelect.addEventListener("change", function () {
    state.sortBy = sortSelect.value;
    render();
  });

  refreshBtn.addEventListener("click", function () { load(true); });

  /* ====== 启动：首屏 + 定时自动刷新 ====== */
  load(true);
  setInterval(function () { load(false); }, AUTO_REFRESH_MS);
})();
</script>
</body>
</html>
